root:
  level: info
  appenders:
    - stderr
    - file

appenders:
  stderr:
    kind: console
    target: stderr
    filters:
      - kind: threshold
        level: info
    encoder:
      kind: pattern
      pattern: "{d(%Y%m%dT%H:%M:%S)} {h({l:.<5})} [{M}] {m}{n}"
    tty_only: false
  file:
    kind: file
    path: "Log/stream-$TIME{%+}.log"
    filters:
      - kind: threshold
        level: debug
    encoder:
      kind: pattern
      pattern: "{d(%Y%m%dT%H:%M:%S)} {h({l:.<5})} [{M}] {m}{n}"
    append: true
