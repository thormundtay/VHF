[package]
name = "VHF-common"
version = "0.1.0"
edition = "2024"

[lib]
name = "vhf_common"
path = "lib.rs"

[dependencies]
jiff = { version = "0.2.13", features = ["serde"] }
serde = { version = "1.0.219" }

[dev-dependencies]
approx = { version = "0.5.1" }
log = { version = "0.4.22" }
test-log = { version = "0.2.17", features = ["trace", "color"] }
