[package]
name = "VHF-common"
version = "0.1.0"
edition = "2024"

[lib]
name = "vhf_common"
path = "lib.rs"

[dependencies]
jiff = { version = "0.2.15", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
approx = { version = "0.5.1" }
log = { version = "0.4.22" }
rand = { version = "0.9.2" }
test-log = { version = "0.2.17", features = ["trace", "color"] }
