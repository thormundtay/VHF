[package]
name = "VHF-parse"
version = "0.1.0"
edition = "2024"

[lib]
name = "vhf_parse"
path = "lib.rs"

[[bin]]
name = "bind-py"
path = "bin/bind-py.rs"

[features]
default = []
o3 = ["numpy", "pyo3"]

[dependencies]
jiff = { version = "0.2.13", features = ["alloc"] }
log = { version = "0.4.22" }
ndarray = { version = "0.16.1" }
numpy = { version = "0.25.0", optional = true }
pyo3 = { version = "0.25.1", default-features = false, features = ["jiff-02"], optional = true }
VHF-common = { path = "../../common" }

[dev-dependencies]
test-log = { version = "0.2.17", features = ["trace", "color"] }
tempfile = { version = "3.19.1", features = ["default"] }
