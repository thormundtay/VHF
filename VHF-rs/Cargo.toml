[package]
name = "VHF"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "stream"

[[bin]]
name = "clear-fifo"
required-features = ["clear-fifo"]

[lib]
name = "vhf"

[features]
# default = ["o3"]
default = []
# Specific to clear-fifo binary.
clear-fifo = ["nix/user", "prettytable-rs"]
# This is for documentation images. We require running `make` before hand for the doc to not fail.
doc-images = ["embed-doc-image"]
# Python interop.
o3 = ["numpy", "pyo3", "pyo3-pylogger", "VHF-parse/o3"]

[dependencies]
bytemuck = { version = "1.23.2", features = ["aarch64_simd"] }
byteorder = { version = "1.5.0" }
clap = { version = "4.5.48", features = ["derive"] }
configparser = { version = "3.1.0", default-features = false }
embed-doc-image = { version = "0.1.4", optional = true }
evalexpr = { version = "12.0.2", features = ["regex"] }
heapless = { version = "0.9.1" }
itertools = { version = "0.14.0" }
jiff = { version = "0.2.15", features = ["alloc", "serde"] }
libc = { version = "0.2" }
log = { version = "0.4.28" }
log4rs = { version = "1.3.0", features = ["console_appender"] }
mmap-rs = { version = "0.7.0" }
nix = { version = "0.29.0", features = ["fs", "ioctl", "user"] }
numpy = { version = "0.25.0", default-features = false, optional = true }
num-traits = { version = "0.2.19" }
pariter = { version = "0.5.1" }
prettytable-rs = { version = "0.10.0", default-features = false, optional = true }
pyo3 = { version = "0.25.1", features = ["jiff-02"], optional = true }
pyo3-pylogger = { version = "0.5.0", optional = true }
regex = { version = "1.11.3" }
serde = { version = "1.0.228" }
serde_json = { version = "1.0.145" }
VHF-common = { path = "common" }
VHF-parse = { path = "src/parser", default-features = false }

[dev-dependencies]
approx = { version = "0.5.1" }
tempfile = { version = "3.23.0", features = ["default"] }
test-log = { version = "0.2.18", features = ["trace", "color"] }
VHF-parse = { path = "src/parser", features = ["internals"] }
